# PETN-I: level 1 (unrelaxed screening) of the first 15 BFDH families, then level 2 (relaxed, T = 0) of up to 10
# families chosen on the level-1 shape, and the Wulff shape. A production run (per-run cap 20 CPU min, about
# 120 CPU min for the material), following campaigns/rdx_wulff.yaml.
#   ./wh campaign plan campaigns/petn_wulff.yaml     (dry run; level 2 waits for the level-1 shape)
#   ./wh campaign run  campaigns/petn_wulff.yaml     (needs the chain; staged: level 1 -> ingest -> shape -> level 2)
#
# Material: the COD 4111071 CIF (PETN-I, P -4 21 c, Z = 2, 100 K; Zhurova, Stash, Tsirelson, Zhurov, Bartashevich,
# Potemkin & Pinkerton, J. Am. Chem. Soc. 128, 14728 (2006); CC0) through cif2lammps with surfenergy's CIF defaults.
# The unit cell is the CIF-zoo entry 'petn', so the zoo's records are this material's too. Point group -42m, so the
# Laue class is 4/mmm (16 operations), not 4/m: (h k l), (k h l), (-h k l), (h k -l) ... are one family, and d_eff
# uses the P-42_1c absences (h00 / 0k0 h odd, 00l l odd, hhl l odd).
campaign: petn_wulff
description: PETN-I, level 1 for 15 BFDH families, level 2 (T = 0) for up to 10, chosen on the level-1 shape
materials:
  - cif: chain:cif2lammps/examples/petn/petn2.cif
    name: PETN-I
forcefield:
  route: reaxff
  ffield: chain:cif2lammps/examples/hmx/reax-lg-2011.ff
  validated: false     # the dataset's convention: ReaxFF-lg is never marked validated
  note: >-
    ReaxFF-lg (reax-lg-2011) adds a low-gradient London dispersion term to ReaxFF, fitted to the experimental
    crystal structures of graphite, polyethylene, CO2, N2, RDX, PETN, TATB and nitromethane (Liu, Liu, Zybin, Sun &
    Goddard, J. Phys. Chem. A 115, 11016 (2011), doi:10.1021/jp201599t; abstract checked 2026-10-23), so PETN's
    lattice is in its fitting set; its surface energies are not validated against a reference, and T = 0 ReaxFF
    relaxations stop at force-field cusps (FIRE in fixed cells)
facets: {select: bfdh_top, n: 15}
level_facets:
  "2": {select: wulff_priority, shape_level: "1", k_sigma: 2, target_ok: 10}
levels: [1, 2]
temperatures: [0]
protocol:
  n_periods: 2
  search_range: 4
  cell_fallbacks:
    - {search_range: 6}
    - {angle_dev: 30}
    - {search_range: 6, angle_dev: 30}
budget: {cpu_minutes: 120, per_run_cap_minutes: 20}
policy: baseline
executor: {backend: local, workers: 2}
dedup: {retry_failed: other_cell}
