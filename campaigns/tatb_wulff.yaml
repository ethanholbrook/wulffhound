# TATB: level 1 (unrelaxed screening) of the first 15 BFDH families, then level 2 (relaxed, T = 0) of up to 10
# families chosen on the level-1 shape, and the Wulff shape. A production run (per-run cap 20 CPU min, about
# 120 CPU min for the material), following campaigns/rdx_wulff.yaml.
#   ./wh campaign plan campaigns/tatb_wulff.yaml     (dry run; level 2 waits for the level-1 shape)
#   ./wh campaign run  campaigns/tatb_wulff.yaml     (needs the chain; staged: level 1 -> ingest -> shape -> level 2)
#
# Material: the chain's tatb1.cif (CSD TATNBZ, CCDC 1266837; Cady & Larson, Acta Cryst. 18, 485 (1965),
# doi:10.1107/S0365110X6500107X), P -1, Z = 2, through cif2lammps with surfenergy's CIF defaults. CCDC-derived: the
# structure file stays in the private chain and is never committed here (tools/check_public.sh refuses tatb*.cif /
# .data / .lmp); the dataset gets gamma values, hkl, lattice parameters and metadata only. The COD has no TATB entry.
# Laue class -1 (2 operations: every family is (h k l) and (-h -k -l)); no systematic absences (P -1).
campaign: tatb_wulff
description: TATB, level 1 for 15 BFDH families, level 2 (T = 0) for up to 10, chosen on the level-1 shape
materials:
  - cif: chain:cif2lammps/examples/tatb/tatb1.cif
    id: tatb
    name: TATB (1,3,5-triamino-2,4,6-trinitrobenzene)
    polymorph: triclinic (Cady & Larson 1965)
    structure_id: ccdc-1266837
    licence: "CCDC terms: not redistributable (only gamma, hkl, lattice parameters and metadata are exported)"
forcefield:
  route: reaxff
  ffield: chain:cif2lammps/examples/hmx/reax-lg-2011.ff
  validated: false     # the dataset's convention: ReaxFF-lg is never marked validated
  note: >-
    ReaxFF-lg (reax-lg-2011) adds a low-gradient London dispersion term to ReaxFF, fitted to the experimental
    crystal structures of graphite, polyethylene, CO2, N2, RDX, PETN, TATB and nitromethane (Liu, Liu, Zybin, Sun &
    Goddard, J. Phys. Chem. A 115, 11016 (2011), doi:10.1021/jp201599t; abstract checked 2026-10-23), so TATB's
    lattice is in its fitting set; its surface energies are not validated against a reference, and T = 0 ReaxFF
    relaxations stop at force-field cusps (FIRE in fixed cells)
facets: {select: bfdh_top, n: 15}
level_facets:
  "2": {select: wulff_priority, shape_level: "1", k_sigma: 2, target_ok: 10}
levels: [1, 2]
temperatures: [0]
protocol:
  n_periods: 2
  search_range: 4
  cell_fallbacks:
    - {search_range: 6}
    - {angle_dev: 30}
    - {search_range: 6, angle_dev: 30}
budget: {cpu_minutes: 120, per_run_cap_minutes: 20}
policy: baseline
# TATB's level-2 runs are slow: surfenergy's FIRE minimisation of the 2-molecule unit cell (the bulk reference, redone
# in every run) reaches its 10000-step cap after ~13.5 min, before the slab. At the default timeout (3 x estimate +
# 120 s; the estimates were 3-11 min) the first 4 level-2 runs were stopped (2026-10-23); a larger factor lets one run.
executor: {backend: local, workers: 2, timeout_factor: 10}
dedup: {retry_failed: other_cell}
