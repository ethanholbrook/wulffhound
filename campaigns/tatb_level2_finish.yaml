# TATB level 2 (T = 0), finishing tatb_level2_caps: {0 1 -1} and {0 1 0} were skipped there at its 40-min per-run
# cap (estimate x measured ratio 48 and 43 CPU min), and {1 0 0} stopped its slab FIRE minimisation at the default
# 12000-step cap (minimisation_not_converged, gamma 277.24). Same material, force field, cell settings and unit-cell
# cap (fire_max_steps_bulk 30000, so the bulk reference is the one of the other 8 families) plus the slab cap raised
# to 30000 (part of the dedup key: the capped {1 0 0} record is a near-duplicate, not a cache hit).
#   ./wh campaign plan campaigns/tatb_level2_finish.yaml
#   ./wh campaign run  campaigns/tatb_level2_finish.yaml     (needs the chain)
# CCDC-derived structure: only gamma, hkl, lattice parameters and metadata are exported (see tatb_wulff.yaml).
campaign: tatb_level2_finish
description: TATB level 2 (T = 0) for {0 1 -1}, {0 1 0} and {1 0 0}, unit-cell and slab FIRE caps 30000
materials:
  - cif: chain:cif2lammps/examples/tatb/tatb1.cif
    id: tatb
    name: TATB (1,3,5-triamino-2,4,6-trinitrobenzene)
    polymorph: triclinic (Cady & Larson 1965)
    structure_id: ccdc-1266837
    licence: "CCDC terms: not redistributable (only gamma, hkl, lattice parameters and metadata are exported)"
forcefield:
  route: reaxff
  ffield: chain:cif2lammps/examples/hmx/reax-lg-2011.ff
  validated: false     # the dataset's convention: ReaxFF-lg is never marked validated
  note: >-
    ReaxFF-lg (reax-lg-2011) adds a low-gradient London dispersion term to ReaxFF, fitted to the experimental
    crystal structures of graphite, polyethylene, CO2, N2, RDX, PETN, TATB and nitromethane (Liu, Liu, Zybin, Sun &
    Goddard, J. Phys. Chem. A 115, 11016 (2011), doi:10.1021/jp201599t; abstract checked 2026-10-23), so TATB's
    lattice is in its fitting set; its surface energies are not validated against a reference, and T = 0 ReaxFF
    relaxations stop at force-field cusps (FIRE in fixed cells)
facets: ['{0 1 -1}', '{0 1 0}', '{1 0 0}']
levels: [2]
temperatures: [0]
protocol:
  n_periods: 2
  search_range: 4
  fire_max_steps_bulk: 30000
  fire_max_steps_slab: 30000
  cell_fallbacks:
    - {search_range: 6}
    - {angle_dev: 30}
    - {search_range: 6, angle_dev: 30}
budget: {cpu_minutes: 200, per_run_cap_minutes: 75}
policy: baseline
executor: {backend: local, workers: 2, timeout_factor: 10}
dedup: {retry_failed: other_cell}
