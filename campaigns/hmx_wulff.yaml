# beta-HMX: level 1 (unrelaxed screening) of the first 15 BFDH families, then level 2 (relaxed, T = 0) of up to 10
# families chosen on the level-1 shape, and the Wulff shape. A production run (per-run cap 20 CPU min, about
# 120 CPU min for the material), following campaigns/rdx_wulff.yaml.
#   ./wh campaign plan campaigns/hmx_wulff.yaml      (dry run; level 2 waits for the level-1 shape)
#   ./wh campaign run  campaigns/hmx_wulff.yaml      (needs the chain; staged: level 1 -> ingest -> shape -> level 2)
#
# Material: the COD 4110146 CIF (beta-HMX, P 1 21/n 1, b unique, Z = 2, 20 K; Zhurova, Zhurov & Pinkerton,
# J. Am. Chem. Soc. 129, 13887 (2007); CC0) through cif2lammps with surfenergy's CIF defaults. The unit cell is the
# CIF-zoo entry 'hmx', so the zoo's records ({0 1 1}, {1 1 0} level 1) and surfenergy's pinned (0 1 0) T = 0 value
# (226.07 mJ/m^2) are this material's too: the planner sees them. Laue class 2/m (4 operations): d_eff uses the
# P2_1/n absences (h0l h + l odd, 0k0 k odd).
campaign: hmx_wulff
description: beta-HMX, level 1 for 15 BFDH families, level 2 (T = 0) for up to 10, chosen on the level-1 shape
materials:
  - cif: chain:cif2lammps/examples/hmx/HMX.cif
    name: beta-HMX
forcefield:
  route: reaxff
  ffield: chain:cif2lammps/examples/hmx/reax-lg-2011.ff
  validated: false     # the dataset's convention: ReaxFF-lg is never marked validated
  note: >-
    ReaxFF-lg (reax-lg-2011) adds a low-gradient London dispersion term to ReaxFF, fitted to the experimental
    crystal structures of graphite, polyethylene, CO2, N2, RDX, PETN, TATB and nitromethane (Liu, Liu, Zybin, Sun &
    Goddard, J. Phys. Chem. A 115, 11016 (2011), doi:10.1021/jp201599t; abstract checked 2026-10-23); HMX is not in
    that set, so for beta-HMX it is a transferred nitramine force field; its surface energies are not validated
    against a reference, and T = 0 ReaxFF relaxations stop at force-field cusps (FIRE in fixed cells)
facets: {select: bfdh_top, n: 15}
level_facets:
  "2": {select: wulff_priority, shape_level: "1", k_sigma: 2, target_ok: 10}
levels: [1, 2]
temperatures: [0]
protocol:
  n_periods: 2
  search_range: 4
  cell_fallbacks:
    - {search_range: 6}
    - {angle_dev: 30}
    - {search_range: 6, angle_dev: 30}
budget: {cpu_minutes: 120, per_run_cap_minutes: 20}
policy: baseline
executor: {backend: local, workers: 2}
dedup: {retry_failed: other_cell}
